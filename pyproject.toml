[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-insight"
version = "0.1.0"
description = "날씨·공휴일·과거 이용 패턴 기반 지하철 이용량 예측"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
    "pandas>=2.2",
    "holidays>=0.106",
    "scikit-learn>=1.5",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "matplotlib>=3.8"]

[project.gui-scripts]
metro-insight = "metro_insight.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"metro_insight.app" = ["resources/*.json", "layout_cache.json"]
"metro_insight.app.styles" = ["*.qss", "*.svg", "*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "legacy_repro: 기존 136일 Test 수치 재현 증거 검사(승인 1회 실행 산출물 확인)",
  "agent: 에이전트 계약·도구·골든셋 검사(LLM·네트워크 없이 오프라인 재생)"
]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
