[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "metro-insight"
version = "0.1.0"
description = "날씨·공휴일·과거 이용 패턴 기반 지하철 이용량 예측"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.7",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.gui-scripts]
metro-insight = "metro_insight.app.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"metro_insight.app" = ["resources/*.json"]
"metro_insight.app.styles" = ["*.qss", "*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
